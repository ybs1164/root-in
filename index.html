<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1626" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="데이트·여행·맛집 코스를 지도에 만들고 링크로 공유하세요" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The Kakao Maps SDK loader and the script it pulls in come from these; connecting early saves round trips before the map can start. -->
    <link rel="preconnect" href="https://dapi.kakao.com" />
    <link rel="preconnect" href="https://t1.daumcdn.net" />
    <!-- Fonts for the app's tall, condensed type (Oswald for Latin, Do Hyeon for Hangul), 꾸미기 text boxes (domain/decor.ts TEXT_FONTS) and the calendar title (Bebas Neue); each has a fallback if this can't load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Do+Hyeon&family=Oswald:wght@400..700&family=Gothic+A1:wght@800;900&family=Jua&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap"
    />
    <title>root-in</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
